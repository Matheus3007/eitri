[project]
name = "eitri"
version = "0.1.0"
description = "AI-drivable design and simulation suite for combat robot spinner weapons"
requires-python = ">=3.11,<3.13"
dependencies = [
    "build123d>=0.9",
    "gmsh>=4.13",
    "numpy>=1.26",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "optuna>=3.6",
    "pydantic>=2.6",
    "typer>=0.12",
    "tomli-w>=1.2.0",
    "cmaes>=0.13.1",
    "shapely>=2.2.0",
]

[project.optional-dependencies]
viewer = ["ocp_vscode>=2.6"]

[project.scripts]
eitri = "eitri.cli:app"

[dependency-groups]
dev = [
    "playwright>=1.64.0",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eitri"]

[tool.pytest.ini_options]
testpaths = ["tests"]
